<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket GPIO Debug</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: black; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #222; }
  </style>
  <script>
    let unityInstance = null;

    window.onload = () => {
      const canvas = document.querySelector("#unity-canvas");

      createUnityInstance(canvas, {
        dataUrl: "Build/build_test_03.data",
        frameworkUrl: "Build/build_test_03.framework.js",
        codeUrl: "Build/build_test_03.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MyCompany",
        productName: "WebSocketInputTest",
        productVersion: "1.0",
      }).then((instance) => {
        unityInstance = instance;
        initWebSocket();
      });
    };

    function initWebSocket() {
      const socket = new WebSocket("ws://localhost:8765");
      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.button && data.state !== undefined) {
            const msg = `${data.button}_${data.state === 1 ? "down" : "up"}`;
            unityInstance.SendMessage("GameManager", "OnGPIOTrigger", msg);
          } else if (data.joystick && data.color) {
            unityInstance.SendMessage("GameManager", "OnEnvUpdate", JSON.stringify(data));
          }
        } catch (err) {
          console.error("Bad message:", event.data);
        }
      };
    }
  </script>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <script src="Build/build_test_03.loader.js"></script>
</body>
</html>
